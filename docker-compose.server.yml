# Use this stack in Dockge / on the server (no git clone needed).
# Image is published by GitHub Actions to GHCR.
# After each deploy: pull new :latest (pull_policy) then recreate.
services:
  gmail-filters:
    image: ghcr.io/matejvrobel/gmail-filters:latest
    container_name: gmail-filters
    restart: unless-stopped
    pull_policy: always
    environment:
      SETTINGS_PATH: /config/settings.yaml
      FILTERS_PATH: /config/filters.yaml
    volumes:
      - ./gmail-filters/config:/config
