# ==========================================
# GMAIL FILTERS CONFIGURATION (TEMPLATE)
# ==========================================
# Copied to ./config/filters.yaml on first Docker start
# (mounted at /config/filters.yaml). Credentials live in settings.yaml.
#
# Criteria — only via `rules:`
# --------------------------------
# Each list item is one rule; rules are joined by OR.
# Fields inside one rule (from / to / subject / text / query) are joined by AND.
# String or list both work for field values.
#
# Inside a field list:
#   - list items → OR
#   - within one string, ` + ` → AND
#   - `!term` → AND NOT; `\+` and `\!` escape those characters
#
#   text:
#     - "word + word1 + word2"     # AND
#     - "word"                     # OR with next items
#     - "word1"
#     - "formulaA \+ formulaB"     # literal '+'
#     - "!spam"                    # exclude
#     - "\!important"              # literal '!important'
#
# `query:` — any raw Gmail search string (escape hatch).
#
# Actions (per label, override defaults):
#   archive:   [true/false] Remove from Inbox
#   mark_read: [true/false] Mark as read
#   star:      [true/false] Star message
# ==========================================

defaults:
  archive: true
  mark_read: false
  star: false

labels:
  Example-Rules:
    archive: true
    mark_read: false
    star: false
    rules:
      # raw Gmail query
      - query: 'from:@acme.com text:urgent'

      # from AND text
      - from: ["@partner.com"]
        text: invoice

      # single-field rules → OR'd with the others
      - from: bank.example
      - text: shipment

      # subject A AND B (via +), exclude newsletter
      - subject:
          - "invoice + due"
          - "!newsletter"

      # some mail from vendor.com (subject match) OR all from billing.vendor.com
      - from:
          - "@vendor.com"
        subject:
          - "invoice"
          - "receipt"
      - from:
          - "@billing.vendor.com"

      # literal + and ! in terms
      - text:
          - "C\\+\\+"           # search for C++
          - "\\!important"     # search for !important
