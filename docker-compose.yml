# Local development — builds from this repo
services:
  gmail-filters:
    build: .
    image: ghcr.io/matejvrobel/gmail-filters:local
    container_name: gmail-filters
    restart: unless-stopped
    environment:
      SETTINGS_PATH: /config/settings.yaml
      FILTERS_PATH: /config/filters.yaml
    volumes:
      - ./config:/config
